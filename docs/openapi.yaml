openapi: 3.0.3
info:
  title: BakaFactory API
  version: 0.2.0
  description: Client-authoritative 2 TPS simulation, single-login accounts and one cloud backup per account. Game state is stored in IndexedDB. Cookie authentication and allowed Origin required for mutations. Factory editing is local; legacy factory paths are retired.
paths:
  /api/v1/game/heartbeat:
    post:
      operationId: gameHeartbeat
      summary: Validate the current login and bind this game to its session
      security: [{ cookieSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [session_id]
              properties:
                session_id:
                  {
                    type: string,
                    description: Empty only for the initial handshake; subsequent calls must send the returned identity. This identity is not a login credential.,
                  }
      responses:
        "200":
          description: Online authorization for at most 30 seconds
          content:
            application/json:
              schema:
                type: object
                required: [user, session_id, lease_seconds]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  session_id: { type: string }
                  lease_seconds: { type: integer, enum: [30] }
        default: { $ref: "#/components/responses/AuthError" }
  /api/v1/game/save:
    parameters:
      - in: header
        name: X-Game-Session
        required: true
        schema: { type: string }
    get:
      operationId: downloadSave
      summary: Download the sole backup of the authenticated account, or null
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: Current backup; legacy server factories are never imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudSaveResponse" }
        default: { $ref: "#/components/responses/AuthError" }
    put:
      operationId: uploadSave
      summary: Replace the sole backup if base_version matches; 409 preserves current backup
      security: [{ cookieSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [base_version, save]
              properties:
                base_version:
                  { type: integer, minimum: 0, maximum: 9007199254740991 }
                save: { $ref: "#/components/schemas/GameSave" }
      responses:
        "200":
          description: Backup committed, including the server version and timestamp
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudSaveResponse" }
        default: { $ref: "#/components/responses/AuthError" }
  /api/v1/definitions:
    get:
      operationId: getDefinitions
      summary: Read validated item, building and recipe definitions
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: Server definition catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
        default: { $ref: "#/components/responses/AuthError" }
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Register a username and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: Registered and logged in; session set through HttpOnly Cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        default:
          $ref: "#/components/responses/AuthError"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Log in and rotate the browser session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Logged in; session set through HttpOnly Cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        default:
          $ref: "#/components/responses/AuthError"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke this browser session and expire its cookie
      responses:
        "204":
          description: Logged out (idempotent)
        default:
          $ref: "#/components/responses/AuthError"
  /api/v1/me:
    get:
      operationId: currentUser
      summary: Current authenticated profile
      security: [{ cookieSession: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        default:
          $ref: "#/components/responses/AuthError"
  /api/v1/me/profile:
    patch:
      operationId: updateProfile
      summary: Save the authenticated user's display name
      security: [{ cookieSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name]
              properties:
                display_name: { type: string, minLength: 1, maxLength: 32 }
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        default:
          $ref: "#/components/responses/AuthError"
  /health:
    get:
      operationId: getHealth
      summary: Server and database readiness
      parameters:
        - in: header
          name: X-Request-ID
          schema: { type: string, maxLength: 64, pattern: "^[a-zA-Z0-9_.-]+$" }
      responses:
        "200":
          description: Server and migrated database ready
          headers:
            X-Request-ID: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Database unavailable
          headers:
            X-Request-ID: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/health:
    get:
      operationId: getVersionedHealth
      summary: Versioned alias for readiness
      responses:
        "200":
          description: Server and migrated database ready
          headers:
            X-Request-ID: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Database unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: bakafactory_session
      description: Production uses __Host-bakafactory_session with Secure; local/test use bakafactory_session.
  responses:
    AuthError:
      description: 400 validation, 401 credentials/session, 403 origin, 405 method, 409 username conflict, 413 body limit, 415 media type, 429 rate limit, or 500 internal failure
      headers:
        X-Request-ID: { schema: { type: string } }
        Retry-After: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    GameSave:
      type: object
      additionalProperties: false
      required: [format_version, rules_version, factory]
      properties:
        format_version: { type: integer, enum: [1] }
        rules_version: { type: integer, enum: [1, 2, 3] }
        factory: { $ref: "#/components/schemas/FactoryDetail" }
    CloudSave:
      type: object
      required: [version, saved_at, save]
      properties:
        version: { type: integer, minimum: 1, maximum: 9007199254740991 }
        saved_at: { type: string, format: date-time }
        save: { $ref: "#/components/schemas/GameSave" }
    CloudSaveResponse:
      type: object
      required: [backup]
      properties:
        backup:
          allOf:
            - { $ref: "#/components/schemas/CloudSave" }
          nullable: true
    BuildingPlacement:
      type: object
      required: [x, y, rotation]
      properties:
        x: { type: integer }
        y: { type: integer }
        size:
          {
            type: integer,
            enum: [1, 2],
            description: "正方形占地边长，缺省 1；坐标为左上角",
          }
        rotation: { type: integer, enum: [0, 90, 180, 270] }
    Factory:
      type: object
      required: [id, owner_id, name, width, height, created_at]
      properties:
        id: { type: string }
        owner_id: { type: string }
        name: { type: string }
        width: { type: integer }
        height: { type: integer }
        created_at: { type: string, format: date-time }
        revision: { type: integer, format: int64, minimum: 0 }
    BuildingInstance:
      type: object
      required: [id, factory_id, building_type, x, y, rotation, configuration]
      properties:
        id: { type: string }
        factory_id: { type: string }
        building_type: { type: string }
        x: { type: integer }
        y: { type: integer }
        size:
          {
            type: integer,
            enum: [1, 2],
            description: "正方形占地边长，缺省 1；坐标为左上角",
          }
        rotation: { type: integer, enum: [0, 90, 180, 270] }
        configuration:
          type: object
          additionalProperties: true
          properties:
            output_count:
              type: integer
              minimum: 1
              maximum: 20
              description: "仅取货终端：单批输出件数上限，缺省 1"
            face_0: { $ref: "#/components/schemas/WarehouseFaceConfiguration" }
            face_90: { $ref: "#/components/schemas/WarehouseFaceConfiguration" }
            face_180:
              { $ref: "#/components/schemas/WarehouseFaceConfiguration" }
            face_270:
              { $ref: "#/components/schemas/WarehouseFaceConfiguration" }
    WarehouseFaceConfiguration:
      type: object
      additionalProperties: true
      required: [mode, filter]
      properties:
        mode: { type: string, enum: [input, output, closed] }
        filter: { type: string }
        output_count:
          type: integer
          minimum: 1
          maximum: 20
          description: "仅 WH 各面：输出模式单批上限，缺省 1，切模式保留"
    FactoryDetail:
      allOf:
        - { $ref: "#/components/schemas/Factory" }
        - type: object
          required: [buildings]
          properties:
            warehouse_activity:
              { $ref: "#/components/schemas/WarehouseActivity" }
            simulation: { $ref: "#/components/schemas/Simulation" }
            robots:
              type: array
              maxItems: 500
              description: "仅主厂保存的已部署机器人；界面投影可读取全局列表"
              items: { $ref: "#/components/schemas/RobotState" }
            active_district_id:
              { type: string, description: "仅主厂区保存的当前显示厂区 ID" }
            districts:
              type: array
              maxItems: 99
              description: "仅主厂区保存的分厂；禁止嵌套分厂，分厂 industry 缺省并共用主厂进度"
              items: { $ref: "#/components/schemas/FactoryDetail" }
            buildings:
              type: array
              items: { $ref: "#/components/schemas/BuildingInstance" }
    WarehouseActivity:
      type: object
      additionalProperties: false
      required: [started_tick, buckets]
      description: "仅主厂保存的最近 120 tick 仓库净变化及按厂进出统计；旧档缺省，从首次采样起满 120 tick 显示"
      properties:
        started_tick:
          {
            type: integer,
            format: int64,
            minimum: 0,
            maximum: 9007199254740991,
          }
        buckets:
          type: array
          maxItems: 120
          items: { $ref: "#/components/schemas/WarehouseActivityBucket" }
    WarehouseActivityBucket:
      type: object
      additionalProperties: false
      required: [tick, delta, factories]
      properties:
        tick:
          {
            type: integer,
            format: int64,
            minimum: 0,
            maximum: 9007199254740991,
          }
        delta:
          type: object
          additionalProperties:
            {
              type: integer,
              format: int64,
              minimum: -9007199254740991,
              maximum: 9007199254740991,
            }
        factories:
          type: object
          maxProperties: 100
          additionalProperties:
            { $ref: "#/components/schemas/WarehouseActivityFlow" }
    WarehouseActivityFlow:
      type: object
      additionalProperties: false
      required: [received, withdrawn]
      properties:
        received:
          type: object
          additionalProperties:
            {
              type: integer,
              format: int64,
              minimum: 1,
              maximum: 9007199254740991,
            }
        withdrawn:
          type: object
          additionalProperties:
            {
              type: integer,
              format: int64,
              minimum: 1,
              maximum: 9007199254740991,
            }
    FactoryResponse:
      type: object
      required: [factory]
      properties:
        factory: { $ref: "#/components/schemas/FactoryDetail" }
    Definition:
      type: object
      required: [id, name, code, icon, color, description]
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string }
        icon: { type: string }
        color: { type: string }
        description: { type: string }
    BuildingDefinition:
      allOf:
        - { $ref: "#/components/schemas/Definition" }
        - type: object
          required: [category, fixed]
          properties:
            supported_sizes:
              type: array
              items: { type: integer, enum: [1, 2] }
              description: "可选占地边长，缺省仅支持 1"
            category: { type: string, enum: [machine, logistics] }
            fixed: { type: boolean }
            input_slots: { type: integer, minimum: 1, maximum: 12 }
            output_slots: { type: integer, minimum: 1, maximum: 12 }
            stack_limit: { type: integer, enum: [100] }
            tier: { type: integer, minimum: 1, maximum: 6 }
            item: { type: string }
            work_mode: { type: string }
            energy: { type: string }
            power_kw: { type: integer, minimum: 0 }
            capacity_kj: { type: integer, minimum: 0, maximum: 30000 }
            station_capacity_kj: { type: integer, minimum: 0, maximum: 30000 }
            station_transfer_kw: { type: integer, minimum: 0, maximum: 100 }
            transfer_kw: { type: integer, minimum: 0, maximum: 1000 }
            fluid_capacity: { type: integer, minimum: 0, maximum: 500 }
            fluid_rate: { type: integer, minimum: 0, maximum: 20 }
            role: { type: string }
            belt_ticks: { type: integer, minimum: 1 }
            batch_size: { type: integer, minimum: 1, maximum: 100 }

            input_whitelist:
              type: array
              items: { type: string }
    ItemStack:
      type: object
      required: [item, count]
      properties:
        item: { type: string }
        count: { type: integer, format: int64, minimum: 1, maximum: 100 }
    MachineState:
      type: object
      required: [input, output, progress, duration, cooldown, status]
      properties:
        terminal_cursor:
          type: integer
          minimum: 0
          maximum: 1
          description: 取货终端下一次优先尝试的物品槽，缺省为 0。
        batches_completed:
          { type: integer, minimum: 0, maximum: 9007199254740991 }
        incident: { $ref: "#/components/schemas/WorkIncident" }
        energy_kj: { type: number, multipleOf: 0.5, minimum: 0, maximum: 16000 }
        station_energy_kj:
          { type: number, multipleOf: 0.5, minimum: 0, maximum: 30000 }
        work_energy_kj:
          { type: number, multipleOf: 0.5, minimum: 0, maximum: 1000 }
        powered: { type: boolean }
        generated_kw: { type: integer, minimum: 0, maximum: 1000 }
        power_demand_kw: { type: integer, minimum: 0, maximum: 1000 }
        network_id: { type: string, maxLength: 160 }
        charge_kj: { type: number, multipleOf: 0.5, minimum: 0, maximum: 30000 }
        charge_remainder: { type: integer, minimum: 0, maximum: 99 }
        medium: { type: integer, minimum: 0, maximum: 10 }
        fluid: { $ref: "#/components/schemas/FluidVolume" }
        flow_in: { type: integer, minimum: 0, maximum: 80 }
        flow_out: { type: integer, minimum: 0, maximum: 80 }
        fluid_cursor: { type: integer, minimum: 0, maximum: 29 }
        fuel:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/ItemStack" }
        input:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/ItemStack" }
        output:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/ItemStack" }
        progress: { type: number, multipleOf: 0.5, minimum: 0 }
        duration: { type: number, multipleOf: 0.5, minimum: 0 }
        cooldown: { type: number, multipleOf: 0.5, minimum: 0, maximum: 60 }
        supplied_kw: { type: integer, minimum: 0, maximum: 1000 }
        status: { type: string }
        belt:
          type: object
          required: [id, item, progress]
          properties:
            id:
              {
                type: string,
                description: Stable payload identity preserved across conveyors and ports,
              }
            item: { type: string }
            progress: { type: integer, minimum: 0, maximum: 3 }
            count: { type: integer, minimum: 1, maximum: 100 }
    TransferEndpoint:
      type: object
      required: [id, building_type, x, y, rotation]
      properties:
        id: { type: string }
        building_type: { type: string }
        x: { type: integer }
        y: { type: integer }
        rotation: { type: integer, enum: [0, 90, 180, 270] }
    ItemTransfer:
      type: object
      required: [id, payload_id, item, tick, source, target]
      properties:
        id: { type: string, description: Unique confirmed transfer event ID }
        payload_id:
          type: string
          description: Same identity as the conveyor payload if present
        item: { type: string }
        count: { type: integer, minimum: 1, maximum: 100 }
        tick: { type: integer, format: int64, minimum: 0 }
        source: { $ref: "#/components/schemas/TransferEndpoint" }
        target: { $ref: "#/components/schemas/TransferEndpoint" }
        via: { $ref: "#/components/schemas/TransferEndpoint" }
    Simulation:
      type: object
      required: [tick, tick_rate, buildings, warehouse]
      properties:
        tick: { type: integer, format: int64, minimum: 0 }
        tick_rate:
          {
            type: integer,
            enum: [1, 2],
            description: "2 TPS; 1 is accepted only for legacy saves.",
          }
        industry: { $ref: "#/components/schemas/IndustryState" }
        networks:
          type: array
          items: { $ref: "#/components/schemas/PowerNetwork" }
        transfers:
          type: array
          description: Confirmed port and Bus transfers from the last three ticks. Cosmetic only; clients deduplicate and never replay on initial load.
          items: { $ref: "#/components/schemas/ItemTransfer" }
        buildings:
          type: object
          additionalProperties: { $ref: "#/components/schemas/MachineState" }
        warehouse:
          type: object
          additionalProperties: { type: integer, format: int64, minimum: 0 }
    RecipeDefinition:
      type: object
      required: [id, name, building_type, inputs, outputs, duration_ms]
      properties:
        id: { type: string }
        name: { type: string }
        building_type: { type: string }
        tier: { type: integer, minimum: 1, maximum: 6 }
        description: { type: string }
        power_kw: { type: integer, minimum: 0 }
        gate: { type: string }

        conditions:
          type: array
          items: { $ref: "#/components/schemas/RecipeCondition" }
        inputs:
          {
            type: object,
            additionalProperties: { type: integer, format: int64 },
          }
        outputs:
          {
            type: object,
            additionalProperties: { type: integer, format: int64 },
          }
        duration_ms:
          { type: integer, format: int64, minimum: 500, multipleOf: 500 }
    Catalog:
      type: object
      required: [version, items, buildings, recipes]
      properties:
        quests:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/QuestDefinition" }
        robots:
          type: array
          items: { $ref: "#/components/schemas/RobotDefinition" }
        version: { type: integer }
        root_item: { type: string }
        starting_machines:
          type: array
          items: { type: string }
        stages:
          type: array
          items: { $ref: "#/components/schemas/StageDefinition" }
        items:
          type: array
          items: { $ref: "#/components/schemas/ItemDefinition" }
        buildings:
          type: array
          items: { $ref: "#/components/schemas/BuildingDefinition" }
        recipes:
          type: array
          items: { $ref: "#/components/schemas/RecipeDefinition" }
    ItemDefinition:
      allOf:
        - { $ref: "#/components/schemas/Definition" }
        - type: object
          properties:
            kind: { type: string }
            tier: { type: integer, minimum: 1, maximum: 6 }

            source_recipes:
              type: array
              items: { type: string }
            used_by:
              type: array
              items: { type: string }
    RobotDefinition:
      type: object
      required:
        [
          item,
          name,
          tier,
          energy,
          capacity,
          energy_capacity_kj,
          action_ticks,
          cross_district,
          role,
          description,
        ]
      properties:
        item: { type: string }
        name: { type: string }
        tier: { type: integer, minimum: 1, maximum: 6 }
        energy: { type: string, enum: [shaft, hydraulic, electric] }
        capacity: { type: integer, minimum: 0, maximum: 32 }
        energy_capacity_kj: { type: integer, minimum: 1, maximum: 30000 }
        action_ticks: { type: integer, minimum: 1, maximum: 60 }
        cross_district: { type: boolean }
        role: { type: string, enum: [carrier, inspector, repair, smart] }
        description: { type: string }
    RobotState:
      type: object
      additionalProperties: false
      required:
        [
          id,
          item,
          home_factory_id,
          home_station,
          factory_id,
          x,
          y,
          energy_kj,
          enabled,
          allowed_zones,
          priority,
          cooldown,
          status,
        ]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        item: { type: string }
        home_factory_id: { type: string }
        home_station: { type: string }
        factory_id: { type: string }
        x: { type: integer, minimum: -10, maximum: 10 }
        y: { type: integer, minimum: -10, maximum: 10 }
        energy_kj: { type: integer, minimum: 0, maximum: 30000 }
        charge_remainder: { type: integer, minimum: 0, maximum: 99 }
        enabled: { type: boolean }
        allowed_zones:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string }
        priority: { type: integer, minimum: 1, maximum: 6 }
        cooldown: { type: integer, minimum: 0, maximum: 60 }
        work_progress: { type: integer, minimum: 0, maximum: 60 }
        completed_tasks:
          { type: integer, minimum: 0, maximum: 9007199254740991 }
        camera: { type: boolean }
        service: { $ref: "#/components/schemas/RobotService" }
        construction: { $ref: "#/components/schemas/RobotConstruction" }
        autonomy: { $ref: "#/components/schemas/RobotAutonomy" }
        behavior_log:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/RobotBehavior" }
        returning:
          { type: string, enum: [cancelled, energy, complete, invalid_target] }
        cargo: { $ref: "#/components/schemas/ItemStack" }
        task: { $ref: "#/components/schemas/RobotTask" }
        transit: { $ref: "#/components/schemas/RobotTransit" }
        status: { type: string, maxLength: 64 }
    RobotConstruction:
      type: object
      additionalProperties: false
      required: [id, factory_id, building_type, x, y, rotation]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        factory_id: { type: string }
        building_type: { type: string }
        x: { type: integer, minimum: -10, maximum: 10 }
        y: { type: integer, minimum: -10, maximum: 10 }
        size:
          {
            type: integer,
            enum: [1, 2],
            description: "正方形占地边长，缺省 1；坐标为左上角",
          }
        rotation: { type: integer, enum: [0, 90, 180, 270] }
        recipe_id: { type: string }
    RobotEndpoint:
      type: object
      additionalProperties: false
      required: [factory_id, building_id]
      properties:
        factory_id: { type: string }
        building_id: { type: string }
    WorkIncident:
      type: object
      additionalProperties: false
      required: [kind, since_tick, inspected, maintained]
      properties:
        kind:
          { type: string, enum: [no_input, no_energy, output_full, fluid_full] }
        since_tick: { type: integer, minimum: 0, maximum: 9007199254740991 }
        inspected: { type: boolean }
        maintained: { type: boolean }
    RobotAutonomy:
      type: object
      additionalProperties: false
      required: [enabled, refill, inspect, maintain, next_tick]
      properties:
        enabled: { type: boolean }
        refill: { type: boolean }
        inspect: { type: boolean }
        maintain: { type: boolean }
        next_tick: { type: integer, minimum: 0, maximum: 9007199254740991 }
    RobotBehavior:
      type: object
      additionalProperties: false
      required: [tick, kind, detail]
      properties:
        tick: { type: integer, minimum: 0, maximum: 9007199254740991 }
        kind:
          {
            type: string,
            enum:
              [
                configured,
                refill,
                inspect,
                maintain,
                waiting,
                construct,
                built,
              ],
          }
        detail: { type: string, minLength: 1, maxLength: 128 }
    RobotService:
      type: object
      additionalProperties: false
      required: [kind, target, since_tick, parts]
      properties:
        kind: { type: string, enum: [inspect, maintain] }
        target: { $ref: "#/components/schemas/RobotEndpoint" }
        since_tick: { type: integer, minimum: 0, maximum: 9007199254740991 }
        parts: { type: integer, minimum: 0, maximum: 1 }
    WorkReceipt:
      type: object
      additionalProperties: false
      required: [kind, robot_id, robot_item, count, last_tick]
      properties:
        kind: { type: string, enum: [freight, inspection, visual] }
        robot_id: { type: string, minLength: 1, maxLength: 128 }
        robot_item: { type: string }
        count: { type: integer, minimum: 1, maximum: 10000 }
        last_tick: { type: integer, minimum: 0, maximum: 9007199254740991 }
    RobotTask:
      type: object
      additionalProperties: false
      required:
        [id, source, target, item, count, channel, repeat, phase, delivered]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        source: { $ref: "#/components/schemas/RobotEndpoint" }
        target: { $ref: "#/components/schemas/RobotEndpoint" }
        item: { type: string }
        count: { type: integer, minimum: 1, maximum: 32 }
        channel: { type: string, enum: [auto, input, fuel] }
        repeat: { type: boolean }
        phase: { type: string, enum: [pickup, deliver] }
        delivered: { type: integer, minimum: 0, maximum: 32 }
    RobotTransit:
      type: object
      additionalProperties: false
      required: [to_factory_id, x, y, remaining_ticks]
      properties:
        to_factory_id: { type: string }
        x: { type: integer, minimum: -1, maximum: 1 }
        y: { type: integer, minimum: -1, maximum: 1 }
        remaining_ticks: { type: integer, minimum: 0, maximum: 8 }
    PowerNetwork:
      type: object
      required:
        [
          id,
          kind,
          producers,
          consumers,
          capacity_kw,
          demand_kw,
          supplied_kw,
          loss_kw,
          charge_kw,
          discharge_kw,
          stored_kj,
        ]
      properties:
        id: { type: string, maxLength: 160 }
        kind: { type: string, enum: [shaft, hydraulic, electric] }
        producers: { type: integer, minimum: 0, maximum: 441 }
        consumers: { type: integer, minimum: 0, maximum: 441 }
        capacity_kw: { type: integer, minimum: 0, maximum: 1000000000 }
        demand_kw: { type: integer, minimum: 0, maximum: 1000000000 }
        supplied_kw: { type: integer, minimum: 0, maximum: 1000000000 }
        loss_kw: { type: integer, minimum: 0, maximum: 1000000000 }
        charge_kw: { type: integer, minimum: 0, maximum: 1000000000 }
        discharge_kw: { type: integer, minimum: 0, maximum: 1000000000 }
        stored_kj:
          { type: number, multipleOf: 0.5, minimum: 0, maximum: 1000000000 }
    FluidVolume:
      type: object
      required: [item, count]
      properties:
        item: { type: string }
        count: { type: integer, minimum: 1, maximum: 500 }
    RecipeCondition:
      type: object
      required: [type]
      properties:
        type: { type: string }
        roles:
          type: array
          items: { type: string }
        tasks_since_last_claim: { type: integer, minimum: 1 }
        min_verified_task_events: { type: integer, minimum: 1 }
    StageDefinition:
      type: object
      required: [tier, name, goal, milestone_item]
      properties:
        tier: { type: integer, minimum: 1, maximum: 6 }
        name: { type: string }
        goal: { type: string }
        milestone_item: { type: string }
    QuestDefinition:
      type: object
      required: [id, tier, title, description, goal, rewards]
      properties:
        id: { type: string }
        tier: { type: integer, minimum: 1, maximum: 6 }
        title: { type: string }
        description: { type: string }
        critical: { type: boolean }
        stage_final:
          type: boolean
          description: 阶段终局任务；同阶段其他任务完成至少一半后可见，领奖解锁下一阶段。
        goal:
          type: object
          required: [type, target, count]
          properties:
            type:
              {
                type: string,
                enum:
                  [
                    obtain_item,
                    workshop_recipe,
                    craft_item,
                    automated_delivery,
                    factory_delivery,
                    submit_items,
                    factory_event,
                    district_count,
                  ],
              }
            target: { type: string }
            count: { type: integer, minimum: 1, maximum: 9007199254740991 }
            items:
              type: array
              minItems: 1
              maxItems: 12
              uniqueItems: true
              description: factory_delivery 或 submit_items 的逐物品目标，每种分别达到 count；提交任务实际扣除总仓库存。
              items: { type: string }
        rewards:
          type: object
          additionalProperties:
            { type: integer, minimum: 1, maximum: 9007199254740991 }
        unlocks:
          type: array
          maxItems: 2
          uniqueItems: true
          items:
            { type: string, enum: [warehouse_orders, stage_2, warehouse_io] }
    QuestProgress:
      type: object
      additionalProperties: false
      required: [completed, claimed, workshop_batches]
      properties:
        stage_quests_version: { type: integer, enum: [1] }
        automated_received:
          { type: integer, minimum: 0, maximum: 9007199254740991 }
        factory_produced:
          type: object
          description: 地图机器实际完成配方的逐物品累计产出，不含工作室。
          additionalProperties:
            { type: integer, minimum: 0, maximum: 9007199254740991 }
        warehouse_received:
          type: object
          description: 物流正常卸货进入 WH 的逐物品累计，不含手动收取与退款。
          additionalProperties:
            { type: integer, minimum: 0, maximum: 9007199254740991 }
        factory_events:
          type: object
          additionalProperties: false
          properties:
            shaft_craft:
              { type: integer, minimum: 0, maximum: 9007199254740991 }
            steam_tank_fill:
              { type: integer, minimum: 0, maximum: 9007199254740991 }
            clockwork_transport:
              { type: integer, minimum: 0, maximum: 9007199254740991 }
            district_count: { type: integer, minimum: 0, maximum: 100 }
        completed:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: string }
        claimed:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: string }
        workshop_batches:
          type: object
          additionalProperties:
            { type: integer, minimum: 0, maximum: 9007199254740991 }
    IndustryState:
      type: object
      required: [stage, milestones, crafted]
      properties:
        developer:
          type: object
          additionalProperties: false
          required: [warehouse_orders_always_available]
          description: 开发测试选项，缺省时全部关闭；不代表任务奖励或阶段解锁。
          properties:
            warehouse_orders_always_available: { type: boolean }
        quests: { $ref: "#/components/schemas/QuestProgress" }
        discovered_items:
          type: array
          uniqueItems: true
          description: 曾获得的物品编号，用于图鉴与首次获得任务；缺省时从制造记录和现有实物补记，不计入制造里程碑。
          items: { type: string }
        work_receipts:
          type: array
          maxItems: 1500
          items: { $ref: "#/components/schemas/WorkReceipt" }
        stage: { type: integer, minimum: 1, maximum: 6 }
        milestones:
          type: array
          maxItems: 6
          items: { type: string }
        crafted:
          type: object
          additionalProperties:
            { type: integer, minimum: 0, maximum: 9007199254740991 }
        workshop:
          type: object
          required: [recipe_id, progress]
          properties:
            recipe_id: { type: string }
            progress: { type: number, multipleOf: 0.5, minimum: 0 }
            remaining:
              type: integer
              minimum: 1
              maximum: 100
              description: 尚未完成的批次，包含正在加工的一批；与 total 同时存在，旧存档缺省为一批。
            total: { type: integer, minimum: 1, maximum: 100 }
            order: { $ref: "#/components/schemas/WorkshopOrder" }
    WorkshopOrder:
      type: object
      additionalProperties: false
      required: [item, requested, steps, step_index, inventory]
      properties:
        item: { type: string }
        requested: { type: integer, minimum: 1, maximum: 1000 }
        steps:
          type: array
          minItems: 1
          maxItems: 256
          items:
            type: object
            additionalProperties: false
            required: [recipe_id, batches]
            properties:
              recipe_id: { type: string }
              batches: { type: integer, minimum: 1, maximum: 100 }
        step_index: { type: integer, minimum: 0, maximum: 255 }
        inventory:
          type: object
          additionalProperties:
            { type: integer, minimum: 0, maximum: 9007199254740991 }
    Credentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          {
            type: string,
            minLength: 3,
            maxLength: 24,
            pattern: "^[a-zA-Z0-9_]+$",
          }
        password:
          {
            type: string,
            minLength: 8,
            maxLength: 128,
            format: password,
            description: At most 128 UTF-8 bytes; not trimmed,
          }
    UserResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/User" }
    User:
      type: object
      additionalProperties: false
      required: [id, username, display_name, created_at, last_login_at]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }
    Health:
      type: object
      additionalProperties: false
      required: [status, version, environment, database]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
        environment: { type: string, enum: [local, test, production] }
        database: { type: string, enum: [ok] }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
